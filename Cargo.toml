[package]
name = "bitkitcore"
version = "0.5.11"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "bitkitcore"
path = "src/lib.rs"

[dependencies]
uniffi = { version = "0.29.4", features = [ "cli", "bindgen" ] }
serde_json = "1.0.114"
serde = { version = "^1.0.209", features = ["derive"] }
tokio = { version = "1.40.0", features = ["rt", "rt-multi-thread", "macros"] }
bitcoin = "0.32.4"
miniscript = "12.3.7"
chrono = "0.4"
lightning-invoice = { version = "0.32.0", features = ["std"] }
thiserror = "2.0.11"
url = "2.5.2"
regex = "1.11.1"
async-trait = "0.1.83"
lazy-regex = "3.3.0"
lnurl-rs = "0.9.0"
openssl = { version = "0.10", features = ["vendored"] }
rand = "0.8.5"
once_cell = "1.20.2"
zeroize = "1.8"
rusqlite = { version = "0.32.1", features = ["bundled", "unlock_notify"] }
rust-blocktank-client = { version = "0.0.16", features = ["rustls-tls"] }
reqwest = { version = "0.12.12", features = ["json", "rustls-tls", "rustls-tls-native-roots"], default-features = false }
r2d2 = "0.8.10"
r2d2_sqlite = "0.25.0"
bitcoin-address-generator = "0.2.0"
uuid = { version = "1.16.0", features = ["v4"] }
hex = "0.4.3"
bip39 = "2.0"
bdk = { version = "0.30.2", features = ["all-keys"] }
boltz-client = { version = "0.4.1", default-features = false, features = ["electrum", "ws"] }
base64 = "0.22"
minicbor = { version = "2", features = ["alloc"] }
ur = "0.5.2"
log = "0.4"
pubky = "0.6.0"
pubky-app-specs = "0.4"

# Bluetooth (for Android JNI initialization)
# btleplug is also pulled in transitively by trezor-connect-rs
btleplug = "0.11"

# Trezor connect library - non-iOS platforms get USB + Bluetooth
[target.'cfg(not(target_os = "ios"))'.dependencies]
trezor-connect-rs = { version = "0.4.0", features = ["psbt"] }

# iOS: Bluetooth only (libusb has no iOS backend, so no USB support)
[target.'cfg(target_os = "ios")'.dependencies]
trezor-connect-rs = { version = "0.4.0", default-features = false, features = ["bluetooth", "psbt"] }

# JNI for Android (must match btleplug's jni version)
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.19"
android_logger = "0.14"

[dev-dependencies]
tokio = { version = "1.40.0", features = ["full"] }
serde_json = "1.0.114"
hex = "0.4.3"
test-case = "3.3.1"
tempfile = "3.2"
serial_test = "3.2.0"
rust_decimal = "1.30"

[[bin]]
name = "example"
path = "example/main.rs"
