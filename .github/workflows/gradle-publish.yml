# This workflow will build a package using Gradle and then publish it to GitHub packages when a release is created
# For more info see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#Publishing-using-gradle

name: Gradle Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., v0.1.0)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event.release.tag_name }}
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Install native build dependencies
      run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config protobuf-compiler

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: platform-tools

    - name: Set up Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r28c
        add-to-path: true

    - name: Export Android NDK
      shell: bash
      run: |
        NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
        echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
        cat "$NDK_PATH/source.properties"
        grep -Fx "Pkg.Revision = 28.2.13676358" "$NDK_PATH/source.properties"

    - name: Extract version from input or tag
      id: version
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        if [[ -z "$VERSION" ]]; then
          VERSION="$GITHUB_REF_NAME"
        fi
        echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

    - name: Generate Android bindings
      run: ./build_android.sh

    - name: Build with Gradle
      working-directory: bindings/android
      run: ./gradlew build -Pversion=${{ steps.version.outputs.version }}

    - name: Upload native debug symbols artifact
      uses: actions/upload-artifact@v7
      with:
        name: bitkit-core-native-debug-symbols-${{ steps.version.outputs.version }}
        path: bindings/android/native-debug-symbols.zip

    - name: Upload native debug symbols to release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.event.release.tag_name || inputs.version }}
        IS_RELEASE_EVENT: ${{ github.event_name == 'release' }}
      shell: bash
      run: |
        # A release event always has a release to attach to, so upload straight
        # away and let any failure fail the step. A manual publish may target a
        # version with no release; skip the upload only in that case, so the
        # package still reaches GitHub Packages. Any other lookup failure (auth,
        # network, rate limiting) has to fail rather than silently publish
        # without symbols.
        if [ "$IS_RELEASE_EVENT" != "true" ]; then
          if ! lookup=$(gh release view "$TAG" 2>&1 >/dev/null); then
            case "${lookup,,}" in
              *"not found"*)
                echo "No release for $TAG; skipping the native debug symbols upload"
                exit 0
                ;;
              *)
                echo "gh release view $TAG failed: $lookup" >&2
                exit 1
                ;;
            esac
          fi
        fi
        gh release upload "$TAG" bindings/android/native-debug-symbols.zip --clobber

    # same credentials env vars used in the publishing section of build.gradle.kts
    - name: Publish to GitHub Packages
      working-directory: bindings/android
      env:
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPO: ${{ github.repository }}
      run: ./gradlew publish -Pversion=${{ steps.version.outputs.version }}
